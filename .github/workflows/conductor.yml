name: Conductor

run-name: "Conductor [${{ github.event.client_payload.repository || github.repository }}] Issue #${{ github.event.client_payload.issue_number || github.event.issue.number }} - Persona: ${{ github.event.client_payload.persona || 'unknown' }} - Event: ${{ github.event.client_payload.event_name || github.event_name }}${{ github.event.client_payload.action && format(' ({0})', github.event.client_payload.action) || '' }}"

on:
  repository_dispatch:
    types: [project_in_progress]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-conductor:
    # No longer filtering by labels/mentions here because the bridge already does it.
    # This prevents duplicate runs for the conductor repo itself.
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Metadata
        id: metadata
        run: |
          ISSUE_NUMBER=$(jq -r '.client_payload.issue_number // empty' "$GITHUB_EVENT_PATH")
          REPO=$(jq -r '.client_payload.repository // "${{ github.repository }}"' "$GITHUB_EVENT_PATH")
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "Target Repo: $REPO, Issue: $ISSUE_NUMBER"

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.metadata.outputs.repository }}
          fetch-depth: 0
          token: ${{ secrets.CONDUCTOR_TOKEN }}
          path: 'target'

      - name: Checkout Conductor Repo
        uses: actions/checkout@v4
        with:
          repository: LLM-Orchestration/conductor
          fetch-depth: 0
          token: ${{ secrets.CONDUCTOR_TOKEN }}
          path: 'conductor'

      - name: Determine Branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.CONDUCTOR_TOKEN }}
          REPO: ${{ steps.metadata.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.metadata.outputs.issue_number }}
        run: |
          BRANCH=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '.labels[].name | select(startswith("branch:"))' 2>/dev/null | cut -d':' -f2- | xargs || true)
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
            BRANCH="issue-$ISSUE_NUMBER"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Selected branch: $BRANCH"

      - name: Switch Target Repo to Branch
        working-directory: target
        run: |
          BRANCH=${{ steps.branch.outputs.branch }}
          git checkout "$BRANCH" || git checkout -b "$BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: conductor/package-lock.json

      - name: Install Dependencies
        working-directory: conductor
        run: npm ci

      - name: Build
        working-directory: conductor
        run: npm run build

      - name: Prepare Codex CLI and API proxy
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          safety-strategy: drop-sudo

      - name: Run Conductor
        working-directory: conductor
        env:
          CONDUCTOR_TOKEN: ${{ secrets.CONDUCTOR_TOKEN }}
          GH_TOKEN: ${{ secrets.CONDUCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CONDUCTOR_TOKEN }}
          CONDUCTOR_CODEX_MODEL: ${{ vars.CONDUCTOR_CODEX_MODEL || 'gpt-5.6-sol' }}
          CONDUCTOR_CODEX_EFFORT: ${{ vars.CONDUCTOR_CODEX_EFFORT || 'xhigh' }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          CONDUCTOR_ROOT: ${{ github.workspace }}/conductor
          CONDUCTOR_TARGET_DIR: ${{ github.workspace }}/target
        run: npm start
